# AI 弹幕助手配置文件 v2.0

# 视觉模型 API（用于截屏弹幕）
vision_api:
  provider: siliconflow
  base_url: https://api.siliconflow.cn/v1
  model: Qwen/Qwen3.5-397B-A17B
  api_key: sk-jfforsvbmalqmcxvahuzxfnhppomiusvatwigwleuriwrtvc

capture:
  enabled: true
  screen_index: 0
  interval: 3
  min_interval: 1
  quality: 50

audio:
  enabled: true
  interval: 15
  vad_threshold: 0.02

danmu:
  count: 5
  max_length: 20
  styles:
    meme: 0.2
    comment: 0.4
    reaction: 0.4
  ai_style: pi          # 初始风格（会被随机覆盖）
  available_styles:     # 可选风格列表
    - pi
    - normal
    - serious
    - tucao
    - kuakua
    - wenyi
    - shadiao
    - lengyoumo
    - fanquan
  # 风格权重（每次截屏随机抽，权重决定概率）
  # 不配则均匀随机；配了则按权重比例
  danmu_ai_style_weights:
    pi: 3               # 玩梗/皮 — 最常见
    normal: 2           # 自然随意
    serious: 1          # 正经描述
    tucao: 2            # 犀利吐槽
    kuakua: 1           # 真诚赞美
    wenyi: 1            # 文艺诗意
    shadiao: 1          # 沙雕无厘头
    lengyoumo: 1        # 冷幽默
    fanquan: 2          # 饭圈化

voice:
  enabled: true
  sample_rate: 48000
  channels: 1
  chunk_duration: 2.0
  silence_threshold: 0.005
  min_voice_ratio: 0.05
  whisper_model: base      # 本地fallback（模型已删，实际走ASR API）
  device: cpu
  compute_type: int8
  # ASR API — 硅基流动 SenseVoiceSmall
  asr_api:
    provider: siliconflow
    base_url: https://api.siliconflow.cn/v1
    api_key: sk-jfforsvbmalqmcxvahuzxfnhppomiusvatwigwleuriwrtvc
    model: FunAudioLLM/SenseVoiceSmall

  # whisper.cpp（本地 C++ 引擎）
  whisper_cpp:
    enabled: false
    exe_path: ""
    model_path: ""
    language: "zh"
    threads: 4

emotion:
  enabled: true
  keywords: true

hanako:
  enabled: false
  ws_url: ws://localhost:18789
  pet_api_url: http://localhost:8080/api/pet
  pet_enabled: false

# B站直播弹幕源（blivedm_client）
# 把指定直播间的弹幕实时拉取并喂给弹幕系统
blivedm:
  enabled: false          # 是否启用 B站直播弹幕
  room_id: 1              # 直播间号（短号或真实 room_id）
  cookie: ""              # 可选：登录 Cookie（拉取需登录的房间弹幕时用）
  # uid: 0                # 可选：登录用户 uid，配合 cookie 使用
  # heartbeat_interval: 30 # 可选：心跳间隔（秒）

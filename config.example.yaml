# AI 弹幕助手配置文件模板
# 复制此文件为 config.yaml 并填写真实值

# 视觉模型 API（用于截屏弹幕）
vision_api:
  provider: siliconflow
  base_url: https://api.siliconflow.cn/v1
  model: Qwen/Qwen3.5-397B-A17B
  api_key: sk-xxx  # 填写你的 API Key

capture:
  enabled: true
  screen_index: 0
  interval: 3
  min_interval: 1
  quality: 50

audio:
  enabled: true
  interval: 15
  vad_threshold: 0.02

danmu:
  count: 5
  max_length: 20
  styles:
    meme: 0.2
    comment: 0.4
    reaction: 0.4
  ai_style: pi

voice:
  enabled: true
  sample_rate: 48000
  channels: 1
  chunk_duration: 1.5
  silence_threshold: 0.01
  min_voice_ratio: 0.1
  whisper_model: base
  device: cpu
  compute_type: int8

  # ASR API 扩展（留空 = 不用远程 API）
  asr_api:
    provider: ""
    base_url: ""
    api_key: ""
    model: ""

  # whisper.cpp（本地 C++ 引擎）
  whisper_cpp:
    enabled: false
    exe_path: ""
    model_path: ""
    language: "zh"
    threads: 4

emotion:
  enabled: true
  keywords: true

hanako:
  enabled: false
  ws_url: ws://localhost:18789
  pet_api_url: http://localhost:8080/api/pet
  pet_enabled: false

# B站直播弹幕源（blivedm_client）
# 把指定直播间的弹幕实时拉取并喂给弹幕系统
blivedm:
  enabled: false          # 是否启用 B站直播弹幕
  room_id: 1              # 直播间号（短号或真实 room_id）
  cookie: ""              # 可选：登录 Cookie（拉取需登录的房间弹幕时用）
  # uid: 0                # 可选：登录用户 uid，配合 cookie 使用
  # heartbeat_interval: 30 # 可选：心跳间隔（秒）
